; agention-llama — global defaults applied to every model the router serves.
;
; This is the default `--models-preset` file. It deliberately lists no models:
; the `[*]` section cascades onto every model the router finds by itself (your
; mounted /models directory and the download cache), so you get sane defaults
; without having to enumerate anything.
;
; Point at your own file when you want per-model control:
;   ./scripts/server.sh --models-ini path/to/models.ini
;   MODELS_INI=./path/to/models.ini docker compose up -d
; See examples/models.ini for a documented starting point.
;
; A key is any llama-server flag without its leading dashes:
;   --ctx-size 8192   ->   ctx-size = 8192
; An unrecognised key is a hard error at startup, not a warning.

version = 1

[*]

; --- change these freely ---------------------------------------------------

; Context window. The biggest lever on memory: an APU shares system RAM with
; the GPU, so this is the first thing to turn down when a model won't fit.
ctx-size = 16384

; Thinking: on | off | auto (auto = follow the model's chat template).
; 'off' is the fast choice for tool-call and extraction work.
reasoning = auto

; How much thinking, when on: minimal | low | medium | high | xhigh | max, or
; 'default' to leave the template alone. Only affects templates that read it.
reasoning-effort = default

; Ceiling on thinking tokens: -1 unrestricted, 0 ends it immediately, N > 0
; caps it. Useful to stop a reasoning model stalling an agent loop.
reasoning-budget = -1

; Host RAM the router may keep weights in between loads. Keep it well under
; total system memory — on an APU the GPU is eating the same pool.
cache-ram = 8GB

; --- baked in: change only if you know why ---------------------------------

; Offload everything. On Strix Halo the GPU and CPU share memory, so there is
; no transfer cost to trade against.
n-gpu-layers = 999

; Required for the fork's Vulkan attention path.
flash-attn = on

; Use the model's own chat template — tool calling needs it to drive the parser.
jinja = on

; Speculative decoding rails. Inert for models that set no spec-type, so these
; are safe as globals: adaptive sizing follows measured acceptance, which makes
; spec-draft-n-max a ceiling rather than a per-model tuning job.
spec-draft-adaptive = on
spec-draft-n-min = 3
spec-draft-ngl = 99
