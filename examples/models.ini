; agention-llama — model config for llama-server's router mode.
;
;   ./scripts/server.sh --models-ini examples/models.ini
;   MODELS_INI=./examples/models.ini docker compose up -d
;
; One section per model. The router exposes each as a model name over the API
; and loads it on demand, so you configure a fleet once instead of running a
; server per model.
;
; A key is any llama-server flag with the leading dashes removed:
;   --ctx-size 8192   ->   ctx-size = 8192
; Short forms (c, ngl, fa) and env names (LLAMA_ARG_CTX_SIZE) work too. Run
; `llama-server --help` for the full list; an unrecognised key is a hard error
; at startup, not a warning.
;
; Precedence, lowest to highest:
;   [*]  ->  [the model's own section]  ->  flags on the llama-server command line
; That last one is a global override across every model, which is usually not
; what you want — keep tuning in this file.

version = 1

; ---------------------------------------------------------------------------
; Global defaults. These apply to every model below unless its own section
; overrides them.
; ---------------------------------------------------------------------------
[*]

; --- the knobs you are most likely to change ------------------------------

; Context window. The single biggest lever on memory use: an APU shares system
; RAM with the GPU, so this is what you turn down first when a model won't fit.
; Override per model for the ones that need room.
ctx-size = 16384

; Thinking. on | off | auto (auto = follow the model's chat template).
; 'off' is the fast choice for tool-call and extraction work; 'on' forces it
; for models whose template leaves it off by default.
reasoning = auto

; How much thinking, when it is on: minimal | low | medium | high | xhigh | max,
; or 'default' to leave the template alone. Only affects templates that read it.
reasoning-effort = default

; Hard ceiling on thinking tokens: -1 unrestricted, 0 ends it immediately,
; N > 0 caps it. Useful to stop a reasoning model stalling an agent loop.
reasoning-budget = -1

; --- baked in: change these only if you know why ---------------------------

; Offload everything to the GPU. On Strix Halo the GPU and CPU share the same
; memory, so there is no transfer cost to trade against.
n-gpu-layers = 999

; Required for the fork's Vulkan attention path.
flash-attn = on

; Use the model's own chat template. Tool-calling needs this to drive the parser.
jinja = on

; Speculative decoding safety rails, inert for models that set no spec-type.
; Adaptive sizing tracks measured acceptance and follows the content, which
; makes spec-draft-n-max a ceiling rather than a value to tune per model.
spec-draft-adaptive = on
spec-draft-n-min = 3
spec-draft-ngl = 99

; Host RAM the router may hold model weights in between loads. Set this well
; under total system memory — on an APU the GPU is eating the same pool.
cache-ram = 8GB

; ---------------------------------------------------------------------------
; Models. The section name is the name clients ask for over the API.
;
; Two kinds:
;   [user/repo-GGUF:QUANT]   a Hugging Face repo — downloaded on first use
;   [any-name-you-like]      a local file, with `model =` giving the path
;
; `alias` adds further names the same model answers to, comma-separated — handy
; for giving a stable name ("fast") to whatever model currently fills that role,
; so clients don't have to change when you swap it. Names and aliases must not
; collide; the router refuses to start if they do.
;
; Paths resolve against the server's working directory. Use absolute paths;
; inside the container /models is your mounted models directory.
; ---------------------------------------------------------------------------

; A plain local model. No speculation — the baseline.
[qwen3-27b]
alias = default
model = /models/Qwen3.8-27B-Q4_K_M.gguf
ctx-size = 32768

; Long context, and the model carries an MTP head — so it drafts against
; itself and needs no sidecar. This is the preset that holds up past ~10k
; tokens; see RECIPES.md for the measured numbers.
[qwen3-27b-mtp]
alias = long
model = /models/Qwen3.8-27B-MTP-Q4_K_M.gguf
ctx-size = 65536
spec-type = draft-mtp
spec-draft-n-min = 2
spec-draft-n-max = 4

; Short context, structured output — the fork's best case, 4.7x bare decode.
; Needs a DFlash2 sidecar trained against THIS target model. Do not requantise
; that sidecar to ROCmFPx: it costs ~7 points of draft acceptance versus a
; plain Q8_0 at the same bpw.
[qwen3-27b-dflash]
alias = short
model = /models/Qwen3.8-27B-Q4_K_M.gguf
ctx-size = 8192
spec-type = draft-dflash
spec-draft-n-max = 7
spec-draft-model = /models/dflash2/Qwen3.8-27B-DFlash2-Q8_0.gguf

; Serving a coding agent's fast tier: many short tool-call-shaped completions,
; thinking off, several in flight at once.
[coder-fast]
alias = fast, marshall-fast
model = /models/Qwen3.8-27B-Q4_K_M.gguf
ctx-size = 32768
reasoning = off
cont-batching = on
parallel = 4
spec-type = draft-dflash
spec-draft-n-max = 7
spec-draft-model = /models/dflash2/Qwen3.8-27B-DFlash2-Q8_0.gguf
; Keep this one resident so the agent's first call isn't a cold load.
load-on-startup = true

; Straight from Hugging Face — no local file needed. Downloads on first use
; into LLAMA_CACHE, which is /models/.cache in the container, so it survives
; the container being recreated.
[ggml-org/gemma-3-4b-it-GGUF:Q4_K_M]
alias = small
ctx-size = 8192

; ---------------------------------------------------------------------------
; Three keys are preset-only — they configure the router, not llama-server:
;   load-on-startup = true    load at boot instead of on first request
;   stop-timeout = 10         seconds to wait before killing an unloading model
;   dedup-cache-models = true hide the cache entry duplicating an hf-repo preset
;
; And five are ignored if you set them here, because the router owns them:
;   host, port, api-key, models-dir, models-preset
; ---------------------------------------------------------------------------
